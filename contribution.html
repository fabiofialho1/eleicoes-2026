<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contribuição por estado</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --namew: 138px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface-1: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --grid: #2c2c2a;
      --axis: #383835;
      --series-1: #3987e5;
      --series-2: #d95926;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --grid: #2c2c2a;
    --axis: #383835;
    --series-1: #3987e5;
    --series-2: #d95926;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--page);
    color: var(--text-primary);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 4px; font-weight: 650; }
  .sub { margin: 0 0 16px; color: var(--text-secondary); font-size: 14px; }

  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 0 0 12px; font-size: 14px; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; background: var(--c); }

  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .panels { grid-template-columns: 1fr; } }
  @media (max-width: 480px) { :root { --namew: 118px; } .row .name { font-size: 12px; } }
  .panel { background: var(--surface-1); border-radius: 12px; padding: 16px 16px 12px; border: 1px solid var(--grid); }
  .panel h2 { font-size: 16px; margin: 0; font-weight: 650; }
  .panel .meta { margin: 2px 0 12px; font-size: 13px; color: var(--text-secondary); }

  .plot { position: relative; padding-bottom: 22px; }
  .rows { position: relative; z-index: 1; }
  .gridline { position: absolute; top: 0; bottom: 22px; width: 1px; background: var(--grid); }
  .tick { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 11px; color: var(--text-muted); }
  .tick0 { transform: none; }
  .axis0 { position: absolute; top: 0; bottom: 22px; left: 0; width: 1px; background: var(--axis); }

  .row { display: grid; grid-template-columns: var(--namew) 1fr; align-items: center; height: 30px; position: relative; }
  .row .name { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
  .track { position: relative; height: 100%; display: flex; align-items: center; }
  .bar {
    height: 20px;
    background: var(--c);
    border-radius: 0 4px 4px 0;
    min-width: 2px;
    outline: none;
    transition: filter .12s;
  }
  .bar:hover, .bar:focus-visible { filter: brightness(1.12); box-shadow: 0 0 0 2px var(--surface-1), 0 0 0 4px var(--c); }
  .val { margin-left: 4px; padding: 0 4px; background: var(--surface-1); font-size: 13px; font-weight: 600; color: var(--text-primary); white-space: nowrap; }
  .plotgrid { position: absolute; inset: 0 0 0 var(--namew); pointer-events: none; }

  .summary { margin: 12px 0 0; font-size: 13px; color: var(--text-secondary); }
  .summary strong { color: var(--text-primary); font-weight: 650; }

  details { margin-top: 16px; background: var(--surface-1); border: 1px solid var(--grid); border-radius: 12px; padding: 12px 16px; }
  summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .tablewrap { overflow-x: auto; margin-top: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-secondary); font-weight: 600; }

  .note { margin-top: 16px; font-size: 12px; color: var(--text-muted); }

  #tip {
    position: fixed; z-index: 10; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.18); max-width: 240px;
  }
  #tip .t-title { color: var(--text-secondary); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  #tip .t-key { width: 10px; height: 2px; background: var(--c); display: inline-block; }
  #tip .t-line { display: flex; justify-content: space-between; gap: 16px; }
  #tip .t-line b { font-size: 14px; }
  #err { color: #d03b3b; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Quais estados mais contribuem com os votos de cada candidato</h1>
  <p class="sub" id="sub">Carregando…</p>
  <div class="legend" id="legend" aria-label="Legenda"></div>
  <div class="panels" id="panels"></div>
  <details>
    <summary>Ver tabela com todas as UFs</summary>
    <div class="tablewrap"><table id="table"></table></div>
  </details>
  <p class="note" id="note"></p>
  <p id="err" role="alert"></p>
</div>
<div id="tip" role="tooltip"></div>

<script>
// UI labels live here, stored data only carries UF ids and candidate numbers.
const UF_NAMES = {
  AC: "Acre", AL: "Alagoas", AM: "Amazonas", AP: "Amapá", BA: "Bahia", CE: "Ceará", DF: "Distrito Federal",
  ES: "Espírito Santo", GO: "Goiás", MA: "Maranhão", MG: "Minas Gerais", MS: "Mato Grosso do Sul",
  MT: "Mato Grosso", PA: "Pará", PB: "Paraíba", PE: "Pernambuco", PI: "Piauí", PR: "Paraná",
  RJ: "Rio de Janeiro", RN: "Rio Grande do Norte", RO: "Rondônia", RR: "Roraima", RS: "Rio Grande do Sul",
  SC: "Santa Catarina", SE: "Sergipe", SP: "São Paulo", TO: "Tocantins", ZZ: "Exterior",
};
const DISPLAY_NAMES = { "22": "Flávio Bolsonaro", "13": "Lula" };
const TOP_N = 10;

const fmtInt = new Intl.NumberFormat("pt-BR");
const fmtPct = (x) => x.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
const tip = document.getElementById("tip");

function titleCase(s) { return s.toLowerCase().replace(/(^|\s)\S/g, (m) => m.toUpperCase()); }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function showTip(ev, cand, row) {
  tip.replaceChildren();
  const title = el("div", "t-title");
  const key = el("span", "t-key");
  key.style.setProperty("--c", cand.color);
  title.append(key, document.createTextNode(`${UF_NAMES[row.uf] ?? row.uf} · ${cand.name}`));
  const l1 = el("div", "t-line"); l1.append(el("span", null, "Votos"), el("b", null, fmtInt.format(row.votes)));
  const l2 = el("div", "t-line"); l2.append(el("span", null, "% do total do candidato"), el("b", null, fmtPct(row.share)));
  const l3 = el("div", "t-line"); l3.append(el("span", null, "Posição"), el("b", null, `${row.rank}º`));
  tip.append(title, l1, l2, l3);
  tip.style.opacity = 1;
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 8) x = ev.clientX - w - pad;
  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = 0; };

function renderPanel(cand, axisMax) {
  const panel = el("section", "panel");
  panel.append(el("h2", null, cand.name));
  panel.append(el("p", "meta", `${fmtInt.format(cand.total)} votos no total · ${cand.topSum.toLocaleString("pt-BR", { maximumFractionDigits: 1 })}% vêm dos 10 estados abaixo`));
  const plot = el("div", "plot");
  const rows = el("div", "rows");
  const grid = el("div", "plotgrid");
  for (let t = 0; t <= axisMax; t += 5) {
    const left = (t / axisMax) * 100 + "%";
    if (t > 0) { const g = el("div", "gridline"); g.style.left = left; grid.append(g); }
    const tk = el("div", t === 0 ? "tick tick0" : "tick", t + "%"); tk.style.left = left; grid.append(tk);
  }
  const base = el("div", "axis0"); base.style.left = "0"; grid.append(base);
  for (const r of cand.top) {
    const row = el("div", "row");
    row.append(el("div", "name", UF_NAMES[r.uf] ?? r.uf));
    const track = el("div", "track");
    const bar = el("div", "bar");
    bar.style.setProperty("--c", cand.color);
    bar.style.width = `${(r.share / axisMax) * 100}%`;
    bar.style.minWidth = "2px";
    bar.tabIndex = 0;
    bar.setAttribute("aria-label", `${UF_NAMES[r.uf] ?? r.uf}: ${fmtPct(r.share)} dos votos de ${cand.name} (${fmtInt.format(r.votes)} votos)`);
    bar.addEventListener("pointermove", (ev) => showTip(ev, cand, r));
    bar.addEventListener("pointerleave", hideTip);
    bar.addEventListener("focus", () => {
      const b = bar.getBoundingClientRect();
      showTip({ clientX: b.right, clientY: b.top }, cand, r);
    });
    bar.addEventListener("blur", hideTip);
    track.append(bar, el("span", "val", fmtPct(r.share)));
    row.append(track);
    rows.append(row);
  }
  plot.append(grid, rows);
  panel.append(plot);
  return panel;
}

async function main() {
  const res = await fetch("data/states.json");
  if (!res.ok) throw new Error(`data/states.json: ${res.status}`);
  const data = await res.json();

  const top2 = data.brazil.candidates.slice(0, 2);
  const cands = top2.map((c, i) => {
    const rows = Object.entries(data.states).map(([uf, s]) => {
      const m = s.candidates.find((x) => x.number === c.number);
      return { uf, votes: m ? m.votes : 0 };
    });
    const total = rows.reduce((a, r) => a + r.votes, 0);
    rows.forEach((r) => (r.share = (r.votes / total) * 100));
    rows.sort((a, b) => b.votes - a.votes);
    rows.forEach((r, k) => (r.rank = k + 1));
    const top = rows.slice(0, TOP_N);
    return {
      number: c.number, name: DISPLAY_NAMES[c.number] ?? titleCase(c.name), party: c.party,
      color: `var(--series-${i + 1})`, total, rows, top, topSum: top.reduce((a, r) => a + r.share, 0),
    };
  });

  const axisMax = Math.ceil((Math.max(...cands.map((c) => c.top[0].share)) + 4) / 5) * 5 // headroom for the value label;
  const legend = document.getElementById("legend");
  cands.forEach((c) => {
    const s = el("span");
    const sw = el("i", "swatch"); sw.style.setProperty("--c", c.color);
    s.append(sw, document.createTextNode(`${c.name} (${c.party})`));
    legend.append(s);
  });

  const panels = document.getElementById("panels");
  cands.forEach((c) => panels.append(renderPanel(c, axisMax)));

  document.getElementById("sub").textContent =
    `Presidente, 1º turno 2026 · participação de cada estado no total de votos do candidato (top ${TOP_N}) · mesma escala nos dois gráficos`;

  // Full table, sorted by the first candidate's share.
  const table = document.getElementById("table");
  const thead = el("thead"); const hr = el("tr");
  hr.append(el("th", null, "UF"));
  cands.forEach((c) => { hr.append(el("th", null, `${c.name} (votos)`), el("th", null, "% do total")); });
  thead.append(hr);
  const tbody = el("tbody");
  cands[0].rows.forEach((r0) => {
    const tr = el("tr");
    tr.append(el("td", null, UF_NAMES[r0.uf] ?? r0.uf));
    cands.forEach((c) => {
      const r = c.rows.find((x) => x.uf === r0.uf);
      tr.append(el("td", null, fmtInt.format(r.votes)), el("td", null, fmtPct(r.share)));
    });
    tbody.append(tr);
  });
  table.append(thead, tbody);

  document.getElementById("note").textContent =
    `Fonte: TSE (resultados.tse.jus.br), apuração de ${data.brazil.updatedAt} (${data.brazil.countedPct.toLocaleString("pt-BR")}% das seções). ` +
    `Percentual = votos do candidato no estado ÷ votos do candidato no país; o exterior conta como unidade à parte.`;
}

main().catch((e) => {
  document.getElementById("sub").textContent = "";
  document.getElementById("err").textContent = "Não foi possível carregar os dados: " + e.message + ". Abra a página por um servidor (npx serve .).";
});
</script>
</body>
</html>
