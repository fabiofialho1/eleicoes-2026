<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contribuição por estado</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --namew: 152px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface-1: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --grid: #2c2c2a;
      --axis: #383835;
      --series-1: #3987e5;
      --series-2: #d95926;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --grid: #2c2c2a;
    --axis: #383835;
    --series-1: #3987e5;
    --series-2: #d95926;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--page);
    color: var(--text-primary);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 4px; font-weight: 650; }
  .sub { margin: 0 0 16px; color: var(--text-secondary); font-size: 14px; }

  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 0 0 12px; font-size: 14px; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; background: var(--c); }

  .panel { background: var(--surface-1); border-radius: 12px; padding: 16px 16px 12px; border: 1px solid var(--grid); }
  .panel h2 { font-size: 16px; margin: 0; font-weight: 650; }
  .panel .meta { margin: 2px 0 12px; font-size: 13px; color: var(--text-secondary); }

  .plot { position: relative; padding-bottom: 22px; }
  .rows { position: relative; z-index: 1; }
  .gridline { position: absolute; top: 0; bottom: 22px; width: 1px; background: var(--grid); }
  .tick { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 11px; color: var(--text-muted); }
  .tick0 { transform: none; }
  .axis0 { position: absolute; top: 0; bottom: 22px; left: 0; width: 1px; background: var(--axis); }

  .row { display: grid; grid-template-columns: var(--namew) 1fr; align-items: center; height: 32px; position: relative; border-radius: 6px; outline: none; }
  .row:hover, .row:focus-visible { background: color-mix(in srgb, var(--grid) 55%, transparent); }
  .row .name { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
  .track { display: flex; flex-direction: column; gap: 2px; justify-content: center; height: 100%; }
  .barline { display: flex; align-items: center; height: 11px; }
  .bar { height: 11px; background: var(--c); border-radius: 0 4px 4px 0; min-width: 2px; }
  .val { margin-left: 4px; padding: 0 4px; background: var(--surface-1); font-size: 11px; font-weight: 600; color: var(--text-primary); white-space: nowrap; line-height: 11px; }
  .plotgrid { position: absolute; inset: 0 0 0 var(--namew); pointer-events: none; }

  .summary { margin: 12px 0 0; font-size: 13px; color: var(--text-secondary); }
  .summary strong { color: var(--text-primary); font-weight: 650; }

  details { margin-top: 16px; background: var(--surface-1); border: 1px solid var(--grid); border-radius: 12px; padding: 12px 16px; }
  summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .tablewrap { overflow-x: auto; margin-top: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-secondary); font-weight: 600; }

  .note { margin-top: 16px; font-size: 12px; color: var(--text-muted); }

  #tip {
    position: fixed; z-index: 10; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.18); max-width: 360px;
  }
  #tip .t-title { color: var(--text-secondary); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  #tip .t-key { width: 10px; height: 2px; background: var(--c); display: inline-block; }
  #tip .t-line { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  #tip .t-line .who { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  #tip .t-line, #tip .t-title { white-space: nowrap; }
  #tip .t-sep { border-top: 1px solid var(--grid); margin: 6px 0 4px; }
  #tip .t-line b { font-size: 14px; }
  #err { color: #d03b3b; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Quanto cada estado contribui para os votos de cada candidato</h1>
  <p class="sub" id="sub">Carregando…</p>
  <div class="legend" id="legend" aria-label="Legenda"></div>
  <div id="panels"></div>
  <details>
    <summary>Ver tabela com todas as UFs</summary>
    <div class="tablewrap"><table id="table"></table></div>
  </details>
  <p class="note" id="note"></p>
  <p id="err" role="alert"></p>
</div>
<div id="tip" role="tooltip"></div>

<script>
// UI labels live here, stored data only carries UF ids and candidate numbers.
const UF_NAMES = {
  AC: "Acre", AL: "Alagoas", AM: "Amazonas", AP: "Amapá", BA: "Bahia", CE: "Ceará", DF: "Distrito Federal",
  ES: "Espírito Santo", GO: "Goiás", MA: "Maranhão", MG: "Minas Gerais", MS: "Mato Grosso do Sul",
  MT: "Mato Grosso", PA: "Pará", PB: "Paraíba", PE: "Pernambuco", PI: "Piauí", PR: "Paraná",
  RJ: "Rio de Janeiro", RN: "Rio Grande do Norte", RO: "Rondônia", RR: "Roraima", RS: "Rio Grande do Sul",
  SC: "Santa Catarina", SE: "Sergipe", SP: "São Paulo", TO: "Tocantins", ZZ: "Exterior",
};
const DISPLAY_NAMES = { "22": "Flávio Bolsonaro", "13": "Lula" };

const fmtInt = new Intl.NumberFormat("pt-BR");
const fmtPct = (x) => x.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
const tip = document.getElementById("tip");

function titleCase(s) { return s.toLowerCase().replace(/(^|\s)\S/g, (m) => m.toUpperCase()); }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function showTip(ev, state) {
  tip.replaceChildren();
  tip.append(el("div", "t-title", `${UF_NAMES[state.uf] ?? state.uf} · ${state.rank}º em votos de ${state.leaderName}`));
  state.cells.forEach((c) => {
    const line = el("div", "t-line");
    const who = el("span", "who");
    const key = el("span", "t-key"); key.style.setProperty("--c", c.cand.color);
    who.append(key, document.createTextNode(c.cand.name));
    const val = el("span"); val.append(el("b", null, fmtPct(c.share)), document.createTextNode(` · ${fmtInt.format(c.votes)} votos`));
    line.append(who, val);
    tip.append(line);
  });
  const diff = state.cells[0].votes - state.cells[1].votes;
  tip.append(el("div", "t-sep"));
  const dl = el("div", "t-line");
  dl.append(el("span", null, `Saldo ${state.cells[0].cand.short} − ${state.cells[1].cand.short}`), el("b", null, (diff > 0 ? "+" : diff < 0 ? "−" : "") + fmtInt.format(Math.abs(diff))));
  tip.append(dl);
  tip.style.opacity = 1;
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 8) x = ev.clientX - w - pad;
  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => { tip.style.opacity = 0; };

function renderChart(cands, states, axisMax) {
  const panel = el("section", "panel");
  panel.append(el("h2", null, `Contribuição de cada estado para o total de votos (ordem: ${cands[0].name})`));
  panel.append(el("p", "meta", "Cada barra = votos do candidato no estado ÷ votos do candidato no país."));
  const plot = el("div", "plot");
  const rows = el("div", "rows");
  const grid = el("div", "plotgrid");
  for (let t = 0; t <= axisMax; t += 5) {
    const left = (t / axisMax) * 100 + "%";
    if (t > 0) { const g = el("div", "gridline"); g.style.left = left; grid.append(g); }
    const tk = el("div", t === 0 ? "tick tick0" : "tick", t + "%"); tk.style.left = left; grid.append(tk);
  }
  const base = el("div", "axis0"); base.style.left = "0"; grid.append(base);

  states.forEach((st, i) => {
    const row = el("div", "row");
    row.tabIndex = 0;
    row.setAttribute("aria-label", `${UF_NAMES[st.uf] ?? st.uf}: ` + st.cells.map((c) => `${c.cand.name} ${fmtPct(c.share)}`).join(", "));
    row.append(el("div", "name", UF_NAMES[st.uf] ?? st.uf));
    const track = el("div", "track");
    st.cells.forEach((c) => {
      const line = el("div", "barline");
      const bar = el("div", "bar");
      bar.style.setProperty("--c", c.cand.color);
      bar.style.width = `${(c.share / axisMax) * 100}%`;
      line.append(bar);
      if (i < 3) line.append(el("span", "val", fmtPct(c.share))); // label only the three largest rows
      track.append(line);
    });
    row.append(track);
    row.addEventListener("pointermove", (ev) => showTip(ev, st));
    row.addEventListener("pointerleave", hideTip);
    row.addEventListener("focus", () => { const b = row.getBoundingClientRect(); showTip({ clientX: b.left + b.width / 2, clientY: b.top }, st); });
    row.addEventListener("blur", hideTip);
    rows.append(row);
  });
  plot.append(grid, rows);
  panel.append(plot);
  return panel;
}

async function main() {
  const res = await fetch("data/states.json");
  if (!res.ok) throw new Error(`data/states.json: ${res.status}`);
  const data = await res.json();

  const cands = data.brazil.candidates.slice(0, 2).map((c, i) => {
    const name = DISPLAY_NAMES[c.number] ?? titleCase(c.name);
    const votesByUf = Object.fromEntries(Object.entries(data.states).map(([uf, s]) => [uf, (s.candidates.find((x) => x.number === c.number) ?? { votes: 0 }).votes]));
    const total = Object.values(votesByUf).reduce((a, v) => a + v, 0);
    return { number: c.number, name, short: name.split(" ")[0], party: c.party, color: `var(--series-${i + 1})`, votesByUf, total };
  });

  // One entry per state: a cell per candidate, ordered by the first candidate's contribution.
  const states = Object.keys(data.states).map((uf) => ({
    uf, leaderName: cands[0].name,
    cells: cands.map((c) => ({ cand: c, votes: c.votesByUf[uf], share: (c.votesByUf[uf] / c.total) * 100 })),
  })).sort((a, b) => b.cells[0].votes - a.cells[0].votes);
  states.forEach((st, i) => (st.rank = i + 1));

  const axisMax = Math.ceil((Math.max(...states.flatMap((s) => s.cells.map((c) => c.share))) + 4) / 5) * 5; // headroom for the value label
  const legend = document.getElementById("legend");
  cands.forEach((c) => {
    const sp = el("span");
    const sw = el("i", "swatch"); sw.style.setProperty("--c", c.color);
    sp.append(sw, document.createTextNode(`${c.name} (${c.party}) · ${fmtInt.format(c.total)} votos`));
    legend.append(sp);
  });

  document.getElementById("panels").append(renderChart(cands, states, axisMax));
  const top3 = states.slice(0, 3);
  const sum3 = (ci) => top3.reduce((a, s) => a + s.cells[ci].share, 0);
  document.getElementById("sub").textContent =
    `Presidente, 1º turno 2026 · ${top3.map((s) => s.uf).join(", ")} somam ${sum3(0).toLocaleString("pt-BR", { maximumFractionDigits: 1 })}% dos votos de ${cands[0].short} e ${sum3(1).toLocaleString("pt-BR", { maximumFractionDigits: 1 })}% dos de ${cands[1].short}`;

  const table = document.getElementById("table");
  const thead = el("thead"); const hr = el("tr");
  hr.append(el("th", null, "UF"));
  cands.forEach((c) => hr.append(el("th", null, `${c.name} (votos)`), el("th", null, "% do total")));
  thead.append(hr);
  const tbody = el("tbody");
  states.forEach((st) => {
    const tr = el("tr");
    tr.append(el("td", null, UF_NAMES[st.uf] ?? st.uf));
    st.cells.forEach((c) => tr.append(el("td", null, fmtInt.format(c.votes)), el("td", null, fmtPct(c.share))));
    tbody.append(tr);
  });
  table.append(thead, tbody);

  document.getElementById("note").textContent =
    `Fonte: TSE (resultados.tse.jus.br), apuração de ${data.brazil.updatedAt} (${data.brazil.countedPct.toLocaleString("pt-BR")}% das seções). ` +
    `O exterior conta como unidade à parte. Passe o mouse (ou use Tab) sobre um estado para ver votos e saldo.`;
}

main().catch((e) => {
  document.getElementById("sub").textContent = "";
  document.getElementById("err").textContent = "Não foi possível carregar os dados: " + e.message + ". Abra a página por um servidor (npx serve .).";
});
</script>
</body>
</html>
