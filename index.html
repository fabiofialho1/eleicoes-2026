<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eleições 2026 Brasil</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="wrap">
  <header class="site-head">
    <h1>Eleições 2026 · Brasil</h1>
    <p>Gráficos e análises das eleições gerais de 2026, feitos com os dados abertos do TSE. Novos gráficos entram aos poucos.</p>
    <p class="status" id="status">Carregando dados…</p>
    <ul class="toc" id="toc" aria-label="Gráficos neste site"></ul>
  </header>
  <main id="charts"></main>
  <p class="foot">Fonte: <a href="https://resultados.tse.jus.br">resultados.tse.jus.br</a> (TSE). Código e dados: <a href="https://github.com/fabiofialho1/eleicoes-2026">github.com/fabiofialho1/eleicoes-2026</a>.</p>
</div>
<script type="module">
import charts from "./charts/registry.js";
import { el } from "./charts/shared.js";

const toc = document.getElementById("toc");
const main = document.getElementById("charts");
const sections = charts.map((c) => {
  const li = el("li"), a = el("a", null, c.title);
  a.href = "#" + c.id;
  li.append(a);
  toc.append(li);
  const sec = el("section", "chart");
  sec.id = c.id;
  sec.append(el("h2", null, c.title), el("p", "chart-desc", c.description));
  const body = el("div", "chart-body");
  sec.append(body);
  main.append(sec);
  return { chart: c, body };
});

try {
  const res = await fetch("data/states.json");
  if (!res.ok) throw new Error(`data/states.json: ${res.status}`);
  const data = await res.json();
  document.getElementById("status").textContent =
    `Presidente, 1º turno · apuração de ${data.brazil.updatedAt} (${data.brazil.countedPct.toLocaleString("pt-BR")}% das seções).`;
  for (const { chart, body } of sections) {
    try { chart.render(body, data); }
    catch (e) { body.append(el("p", "error", `Não foi possível desenhar este gráfico: ${e.message}`)); }
  }
} catch (e) {
  document.getElementById("status").textContent = "";
  sections.forEach(({ body }) => body.append(el("p", "error", `Não foi possível carregar os dados: ${e.message}. Abra o site por um servidor (npx serve .).`)));
}
</script>
</body>
</html>
