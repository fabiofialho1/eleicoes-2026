<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eleições 2026 Brasil</title>
<!-- The code version lives here (shown in the footer); bump it on every change, in Europe/Berlin time. -->
<meta name="app-version" content="Versão do código: 2026-10-05 19:15">
<script>
// Always load the newest deploy. GitHub Pages lets browsers keep files for about 10 minutes, so on the published
// site every visit is redirected once to the same address with a unique ?_cb= value, which skips any cached copy.
// The stylesheet, modules and data reuse that value, so they are fresh too. Elsewhere (local server, preview) it does nothing.
(function () {
  var m = location.search.match(/[?&]_cb=(\d+)/);
  // A _cb value older than a minute (bookmark, history, reloaded tab) would reuse stale cached files, so it gets replaced.
  var fresh = m && Date.now() - Number(m[1]) < 60000;
  if (!fresh && location.hostname.endsWith("github.io")) {
    var search = location.search.replace(/([?&])_cb=\d+&?/, "$1").replace(/[?&]$/, "");
    location.replace(location.pathname + search + (search ? "&" : "?") + "_cb=" + Date.now() + location.hash);
    return;
  }
  var q = m ? "?_cb=" + m[1] : "";
  window.__CB = q;
  // Module files that can change between deploys. A file missing from this list still works,
  // it is only subject to the browser cache.
  var modules = ["charts/registry.js", "charts/shared.js", "charts/brazil-map.js", "charts/geometry.js", "charts/cover.js", "charts/map.js", "charts/regions.js", "charts/regions-grouped.js", "charts/contribution.js", "charts/contribution-by-candidate.js"];
  var imports = {};
  modules.forEach(function (f) { imports["./" + f] = "./" + f + q; });
  document.write('<link rel="stylesheet" href="site.css' + q + '">');
  document.write('<script type="importmap">' + JSON.stringify({ imports: imports }) + "<\/script>");
})();
</script>
</head>
<body>
<div class="wrap">
  <div id="cover-slot"></div>
  <header class="site-head">
    <h1 id="site-title"><a href="#">Eleições 2026 · Brasil</a></h1>
    <p>Gráficos e análises das eleições gerais de 2026, feitos com os dados abertos do TSE. Novos gráficos entram aos poucos.</p>
    <p class="status" id="status">Carregando dados…</p>
  </header>
  <main id="screen"></main>
  <p class="foot">Fonte: <a href="https://resultados.tse.jus.br">resultados.tse.jus.br</a> (TSE). Código e dados: <a href="https://github.com/fabiofialho1/eleicoes-2026">github.com/fabiofialho1/eleicoes-2026</a>.<br><span id="version"></span></p>
</div>
<script type="module">
import charts from "./charts/registry.js";
import { el, hideTip } from "./charts/shared.js";
import { renderCover } from "./charts/cover.js";

// Two kinds of screen, chosen by the URL hash: the list of charts (empty hash) and one chart (#<id>).
// Each change of hash is a history entry, so the browser/Android back button goes from a chart to the list.
const screen = document.getElementById("screen");
let data = null;
let loadError = null;

function home() {
  const list = el("div", "home-list");
  for (const c of charts) {
    const a = el("a", "home-card");
    a.href = "#" + c.id;
    a.append(el("h2", null, c.title), el("p", null, c.description), el("span", "home-go", "Abrir gráfico →"));
    list.append(a);
  }
  return list;
}

function chartScreen(chart) {
  const sec = el("section", "chart");
  const back = el("a", "back", "← Todos os gráficos");
  back.href = "#";
  const h2 = el("h2", null, chart.title);
  h2.tabIndex = -1;
  const body = el("div", "chart-body");
  sec.append(back, h2, el("p", "chart-desc", chart.description), body);
  if (loadError) body.append(el("p", "error", `Não foi possível carregar os dados: ${loadError}. Abra o site por um servidor (npx serve .).`));
  else if (data) {
    try { chart.render(body, data); }
    catch (e) { body.append(el("p", "error", `Não foi possível desenhar este gráfico: ${e.message}`)); }
  }
  return { sec, h2 };
}

function route() {
  hideTip();
  const hash = location.hash.slice(1);
  const chart = charts.find((c) => c.id === hash);
  const slot = document.getElementById("cover-slot");
  // The cover (the Instagram post layout) is the front page. #capa shows only the cover, at 1080 x 1350, for the picture.
  document.body.classList.toggle("capa", hash === "capa");
  if ((!chart || hash === "capa") && data) renderCover(slot, data); else slot.replaceChildren();
  screen.replaceChildren();
  if (chart) {
    const { sec, h2 } = chartScreen(chart);
    screen.append(sec);
    document.title = `${chart.title} · Eleições 2026 Brasil`;
    window.scrollTo(0, 0);
    h2.focus({ preventScroll: true });
  } else {
    screen.append(home());
    document.title = "Eleições 2026 Brasil";
    window.scrollTo(0, 0);
  }
}

window.addEventListener("hashchange", route);
route();

try {
  const res = await fetch("data/states.json" + (window.__CB || ""));
  if (!res.ok) throw new Error(`data/states.json: ${res.status}`);
  data = await res.json();
  document.getElementById("status").textContent =
    `Presidente, 1º turno: ninguém passou de 50% dos votos válidos, vai para o 2º turno · apuração de ${data.brazil.updatedAt} (${data.brazil.countedPct.toLocaleString("pt-BR")}% das seções).`;
} catch (e) {
  loadError = e.message;
  document.getElementById("status").textContent = "";
}
route();
</script>
</body>
</html>
